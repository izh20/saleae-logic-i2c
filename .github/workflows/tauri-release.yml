name: Tauri Cross-Platform Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            artifact_name: touchpad-tracker-macos
            artifact_paths: |
              touchpad-tracker-tauri/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            artifact_name: touchpad-tracker-windows
            artifact_paths: |
              touchpad-tracker-tauri/src-tauri/target/release/bundle/msi/*.msi
              touchpad-tracker-tauri/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux
            os: ubuntu-22.04
            artifact_name: touchpad-tracker-linux
            artifact_paths: |
              touchpad-tracker-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
              touchpad-tracker-tauri/src-tauri/target/release/bundle/deb/*.deb
              touchpad-tracker-tauri/src-tauri/target/release/bundle/rpm/*.rpm

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: touchpad-tracker-tauri

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: touchpad-tracker-tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: touchpad-tracker-tauri/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          test "v${APP_VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${APP_VERSION}"
            exit 1
          }

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri bundles
        run: npm run tauri build

      - name: Upload platform bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Touchpad Tracker ${{ github.ref_name }}
          files: release-artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
